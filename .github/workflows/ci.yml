name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci enforces that package.json and package-lock.json stay in sync
      # and compiles the better-sqlite3 native module — a real build the host relies on.
      - name: Install dependencies
        run: npm ci

      # lint = node --check syntax gate; smoke = boot server.js and require a 200.
      - name: Verify (lint + smoke)
        run: npm run verify
