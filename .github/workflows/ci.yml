name: CI

on:
  workflow_dispatch: {}
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # --frozen-lockfile enforces that package.json and pnpm-lock.yaml stay in sync
      # and compiles the better-sqlite3 native module — a real build the host relies on.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # lint = node --check syntax gate; smoke = boot server.js and require a 200.
      - name: Verify (lint + smoke)
        run: pnpm run verify
